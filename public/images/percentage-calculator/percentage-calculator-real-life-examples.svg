<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" fill="none" role="img" aria-labelledby="pc-examples-title pc-examples-desc">
  <title id="pc-examples-title">Percentage calculator examples for shopping discounts, exam marks, increases and budget comparisons.</title>
  <desc id="pc-examples-desc">Four real-life percentage examples: Shopping discount (25% of $80 = $20 savings), Exam result (68 out of 80 = 85%), Percentage increase (120 to 150 = +25% increase), and Budget share ($300 of $1,200 = 25%).</desc>
  <rect width="960" height="360" rx="20" fill="#F5F8FF" stroke="#DBEAFE" stroke-width="2" />

  <!-- Card 1: Shopping Discount (Top Left) -->
  <g transform="translate(24, 24)">
    <rect width="444" height="146" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="20" y="18" width="132" height="24" rx="6" fill="#EFF6FF" />
    <text x="86" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563EB">Shopping Discount</text>
    <text x="424" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B">Mode 1: X% of Y</text>

    <text x="20" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1E293B">25% of $80 = $20 savings</text>
    <text x="20" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">Formula: (25 ÷ 100) × 80 = 20</text>

    <rect x="20" y="102" width="404" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="32" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Discount amount = <tspan font-weight="700" fill="#2563EB">$20</tspan> · Final price before tax = <tspan font-weight="700" fill="#1E293B">$80 − $20 = $60</tspan></text>
  </g>

  <!-- Card 2: Exam Result (Top Right) -->
  <g transform="translate(492, 24)">
    <rect width="444" height="146" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="20" y="18" width="104" height="24" rx="6" fill="#EFF6FF" />
    <text x="72" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563EB">Exam Result</text>
    <text x="424" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B">Mode 2: X of Y</text>

    <text x="20" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1E293B">68 out of 80 = 85%</text>
    <text x="20" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">Formula: (68 ÷ 80) × 100 = 85%</text>

    <rect x="20" y="102" width="404" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="32" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Part X = 68 marks · Whole Y = 80 marks · Score = <tspan font-weight="700" fill="#2563EB">85%</tspan></text>
  </g>

  <!-- Card 3: Percentage Increase (Bottom Left) -->
  <g transform="translate(24, 190)">
    <rect width="444" height="146" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" />
    <rect x="20" y="18" width="136" height="24" rx="6" fill="#ECFDF5" />
    <text x="88" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669">Percentage Increase</text>
    <text x="424" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B">Mode 3: % Change</text>

    <text x="20" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1E293B">120 to 150 = 25% increase</text>
    <text x="20" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">Formula: ((150 − 120) ÷ 120) × 100 = +25%</text>

    <rect x="20" y="102" width="404" height="28" rx="8" fill="#ECFDF5" stroke="#A7F3D0" />
    <text x="32" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#065F46">Initial = 120 · Final = 150 · Net Difference = <tspan font-weight="700">+30 (+25%)</tspan></text>
  </g>

  <!-- Card 4: Budget Share (Bottom Right) -->
  <g transform="translate(492, 190)">
    <rect width="444" height="146" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="20" y="18" width="108" height="24" rx="6" fill="#EFF6FF" />
    <text x="74" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563EB">Budget Share</text>
    <text x="424" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#64748B">Mode 2: X of Y</text>

    <text x="20" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1E293B">$300 of $1,200 = 25%</text>
    <text x="20" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">Formula: (300 ÷ 1200) × 100 = 25%</text>

    <rect x="20" y="102" width="404" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="32" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Category expense = $300 · Total budget = $1,200 · Share = <tspan font-weight="700" fill="#2563EB">25%</tspan></text>
  </g>
</svg>
